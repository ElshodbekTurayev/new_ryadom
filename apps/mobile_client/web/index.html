<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ryadom — order from nearby shops with fast delivery.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ryadom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ryadom</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F5C45">

  <!--
    Plain brand background with a slim loading bar while the Flutter engine
    and app code download (instead of a blank white page). It fades out on
    Flutter's first frame, where the illustrated intro takes over.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #0F5C45; }
    #ryadom-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #147558 0%, #0F5C45 100%);
      transition: opacity 400ms ease;
    }
    #ryadom-splash.hide { opacity: 0; pointer-events: none; }
    #ryadom-splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255, 255, 255, 0.18); animation: rs-fade 400ms 300ms ease both;
    }
    #ryadom-splash .bar::after {
      content: ""; display: block; width: 40px; height: 100%; background: #fff;
      animation: rs-sweep 1.1s ease-in-out infinite;
    }
    @keyframes rs-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rs-sweep { from { transform: translateX(-40px); } to { transform: translateX(120px); } }
    @media (prefers-reduced-motion: reduce) {
      #ryadom-splash *, #ryadom-splash *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="ryadom-splash" role="progressbar" aria-label="Ryadom">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('ryadom-splash');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 450);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
