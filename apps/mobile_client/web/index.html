<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ryadom — order from nearby shops with fast delivery.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ryadom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ryadom</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F5C45">

  <!--
    Native splash shown while the Flutter engine and app code download, so
    the first thing users see is the brand instead of a blank page. It matches
    the in-app SplashScreen and fades out on Flutter's first frame.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #0F5C45; }
    #ryadom-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #147558 0%, #0F5C45 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 400ms ease;
    }
    #ryadom-splash.hide { opacity: 0; pointer-events: none; }
    #ryadom-splash .mark {
      width: 96px; height: 96px; border-radius: 28px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      color: #0F5C45; font-size: 52px; font-weight: 900; line-height: 1;
      box-shadow: 0 12px 32px rgba(20, 35, 28, 0.25);
      animation: rs-pop 700ms cubic-bezier(.34, 1.56, .64, 1) both, rs-breathe 2.8s ease-in-out 700ms infinite;
    }
    #ryadom-splash .name {
      margin-top: 28px; color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
      animation: rs-rise 500ms 250ms cubic-bezier(.25, 1, .5, 1) both;
    }
    #ryadom-splash .bar {
      margin-top: 40px; width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255, 255, 255, 0.18); animation: rs-rise 400ms 500ms ease both;
    }
    #ryadom-splash .bar::after {
      content: ""; display: block; width: 40px; height: 100%; background: #fff;
      animation: rs-sweep 1.1s ease-in-out infinite;
    }
    @keyframes rs-pop { from { opacity: 0; transform: scale(.55) rotate(-10deg); } to { opacity: 1; transform: none; } }
    @keyframes rs-breathe { 50% { transform: scale(1.035); } }
    @keyframes rs-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes rs-sweep { from { transform: translateX(-40px); } to { transform: translateX(120px); } }
    @media (prefers-reduced-motion: reduce) {
      #ryadom-splash *, #ryadom-splash *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="ryadom-splash" role="progressbar" aria-label="Ryadom">
    <div class="mark">R</div>
    <div class="name">Ryadom</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('ryadom-splash');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 450);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
